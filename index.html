<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto JS</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <header>
        <h1>Projeto JS - Comentários</h1>
        <p>Uma aplicação para inserir comentários em JavaScript</p>
    </header>
    <main>
        <section class="comment-input">
            <p>Adicione seus comentários:</p>
            <input type="text" id="commentInput" placeholder="Digite seu comentário">
            <button>+</button>
        </section>
        <section class="comments">
            <p>Esse é o primeiro comentário.</p>
            <p>Esse é o segundo.</p>
        </section>
    </main>
    <footer>
        <P>Desenvolvido por: nome</P>
    </footer>
    <script src="http://code.jquery.com/jquery-2.0.3.min.js"></script>
    <script src="comentarios.js"></script>
</body>
</html>
